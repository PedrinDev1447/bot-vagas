[project]
name = "bot-vagas"
version = "0.1.0"
description = "Bot que coleta vagas de estágio/júnior em SP e alerta no Telegram"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
